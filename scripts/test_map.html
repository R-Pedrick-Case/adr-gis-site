<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>UK Broadband</title>

<link href="https://unpkg.com/maplibre-gl@5.8.1/dist/maplibstyle>
body { margin:0; }
#map {
    width:100vw;
    height:100vh;
}
</style>

</head>

<body>

<div id="map"></div>

5.8.1/dist/maplibre-gl.js"></script>

<script>

const map = new maplibregl.Map({
    container: "map",

    style: {
        version: 8,

        sources: {

            osm: {
                type: "raster",
                tiles: [
                  "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
                ],
                tileSize: 256
            },

            connectivity: {
                type: "vector",
                url: "http://localhost:3000/connectivity"
            }

        },

        layers: [

            {
                id: "osm",
                type: "raster",
                source: "osm"
            },

            {
                id: "hexes",
                type: "fill",
                source: "connectivity",
                "source-layer": "uk_connectivity_hex_2025",

                paint: {

                    "fill-color": [
                        "interpolate",
                        ["linear"],
                        ["get", "Gigabit availability (% premises)"],

                        0, "#d73027",
                        50, "#fc8d59",
                        75, "#fee08b",
                        90, "#91cf60",
                        100, "#1a9850"
                    ],

                    "fill-opacity": 0.7
                }
            }

        ]
    },

    center: [-2.5, 54],
    zoom: 5
});

</script>

</body>
</html>
